<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="zx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D84040" />
      <stop offset="100%" stop-color="#821414" />
    </linearGradient>
    <linearGradient id="zx-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7575" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#550A0A" stop-opacity="0.8" />
    </linearGradient>
    <filter id="zx-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#zx-grad)" stroke="url(#zx-stroke)" stroke-width="8" filter="url(#zx-shadow)" />

  <!-- Bold geometric Zentrix Z mark -->
  <polygon points="135,130 377,130 377,180 225,340 377,340 377,390 135,390 135,340 287,180 135,180" fill="#ECDCBF" />

  <!-- Signature brand dot -->
  <circle cx="388" cy="125" r="24" fill="#ECDCBF" stroke="#821414" stroke-width="5" />
</svg>