<!doctype html>
<html lang="en">
  <head>
    <!-- Technical Meta -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Metadata -->
    <title>Zentrix — Decentralized Freelance Marketplace</title>
    <meta name="title" content="Zentrix — Decentralized Freelance Marketplace" />
    <meta
      name="description"
      content="Decentralized freelance marketplace with on-chain milestone escrow, Sarvam-30B AI talent matching, and soulbound reputation credentials on MST Blockchain Testnet."
    />
    <meta
      name="keywords"
      content="Zentrix, Web3 Freelancing, MST Blockchain, Milestone Escrow, Sarvam AI, Soulbound Reputation, Smart Contracts"
    />
    <meta name="author" content="Zentrix Protocol" />
    <meta name="robots" content="index, follow" />

    <!-- Theme & Mobile App Identity -->
    <meta name="theme-color" content="#D84040" />
    <meta name="msapplication-TileColor" content="#D84040" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zentrix" />
    <meta name="application-name" content="Zentrix" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zentrix" />
    <meta property="og:title" content="Zentrix — Decentralized Freelance Marketplace" />
    <meta
      property="og:description"
      content="Trust-minimized milestone escrow, Sarvam-30B AI matching, and soulbound credentials. Built on MST Blockchain Testnet."
    />
    <meta property="og:image" content="/android-chrome-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Zentrix Protocol Brand Mark" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zentrix — Decentralized Freelance Marketplace" />
    <meta
      name="twitter:description"
      content="Trust-minimized milestone escrow, Sarvam-30B AI matching, and soulbound credentials on MST Testnet."
    />
    <meta name="twitter:image" content="/android-chrome-512x512.png" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Typography Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-surface text-ink min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
